<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A020E" />
      <stop offset="60%" stop-color="#700F29" />
      <stop offset="100%" stop-color="#8A1538" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD175" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8A1538" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  
  <!-- Modern Qatari Wave/Serrated Pattern -->
  <g fill="#FFFFFF" opacity="0.08">
    <polygon points="0,450 15,400 30,450 45,400 60,450 75,400 90,450 105,400 120,450 135,400 150,450 165,400 180,450 195,400 210,450 225,400 240,450 800,450 800,380 0,380" />
  </g>

  <!-- Gymnastic Rings and Sparkles -->
  <g stroke="#FFFFFF" opacity="0.15" fill="none">
    <circle cx="650" cy="150" r="80" stroke-width="2" />
    <circle cx="680" cy="130" r="60" stroke-width="1.5" />
    <path d="M100,80 L105,95 L120,100 L105,105 L100,120 L95,105 L80,100 L95,95 Z" fill="#FFFFFF" stroke="none" />
  </g>

  <!-- Ground -->
  <path d="M0,390 Q400,360 800,390 L800,450 L0,450 Z" fill="#2E010A" />

  <!-- CUTE CHIBI ANIME BOY (Early Childhood - 6-8 years) -->
  <g transform="translate(180, 100)">
    <!-- Shadow -->
    <ellipse cx="100" cy="290" rx="60" ry="12" fill="#000000" opacity="0.4" />

    <!-- Left Arm (running gesture) -->
    <path d="M50,190 Q30,170 15,190 Q10,195 20,205 Q35,195 50,200 Z" fill="#FFFFFF" />
    <circle cx="15" cy="190" r="8" fill="#FAD1B0" />

    <!-- Legs -->
    <!-- Left Leg -->
    <rect x="70" y="240" width="18" height="40" rx="5" fill="#FFFFFF" />
    <ellipse cx="79" cy="283" rx="14" ry="8" fill="#C9A227" /> <!-- Shoe -->
    <!-- Right Leg (running/lifted) -->
    <path d="M110,240 Q130,250 140,270 Q145,280 135,285 Q125,275 110,255 Z" fill="#FFFFFF" />
    <ellipse cx="140" cy="275" rx="12" ry="8" fill="#C9A227" /> <!-- Shoe -->

    <!-- Body (Maroon/White PE Kit) -->
    <path d="M55,170 L145,170 L135,245 L65,245 Z" fill="#FFFFFF" /> <!-- White T-shirt -->
    <path d="M55,170 L100,195 L145,170 L135,175 L100,200 L65,175 Z" fill="#8A1538" /> <!-- Maroon collar V-neck -->
    <path d="M65,240 L135,240 L138,260 L62,260 Z" fill="#8A1538" /> <!-- Maroon PE Shorts -->

    <!-- Right Arm (raised high happily) -->
    <path d="M140,175 Q165,135 180,110 Q190,105 195,115 Q185,125 155,185 Z" fill="#FFFFFF" />
    <circle cx="185" cy="110" r="8" fill="#FAD1B0" /> <!-- Hand -->

    <!-- Head & Face (Anime Style) -->
    <path d="M50,110 Q50,70 100,70 Q150,70 150,110 Q150,150 100,150 Q50,150 50,110 Z" fill="#FAD1B0" /> <!-- Face skin -->
    <!-- Cute Blush -->
    <ellipse cx="75" cy="128" rx="8" ry="4" fill="#FF8D8D" opacity="0.6" />
    <ellipse cx="125" cy="128" rx="8" ry="4" fill="#FF8D8D" opacity="0.6" />

    <!-- Cute Big Expressive Anime Eyes -->
    <!-- Left Eye -->
    <ellipse cx="80" cy="115" rx="10" ry="14" fill="#1A0A0F" />
    <circle cx="77" cy="110" r="4" fill="#FFFFFF" /> <!-- Reflection -->
    <circle cx="83" cy="120" r="2" fill="#FFFFFF" /> <!-- Secondary Reflection -->
    <!-- Right Eye -->
    <ellipse cx="120" cy="115" rx="10" ry="14" fill="#1A0A0F" />
    <circle cx="117" cy="110" r="4" fill="#FFFFFF" />
    <circle cx="123" cy="120" r="2" fill="#FFFFFF" />
    <!-- Eyelashes/Brows -->
    <path d="M70,98 Q80,94 92,98" stroke="#1A0A0F" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M108,98 Q120,94 130,98" stroke="#1A0A0F" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Smile -->
    <path d="M92,132 Q100,142 108,132" stroke="#1A0A0F" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Anime Spiky Black Hair -->
    <path d="M48,105 Q40,70 65,55 Q80,70 85,60 Q95,75 105,50 Q115,70 125,55 Q135,70 145,60 Q160,80 152,105 Q165,115 155,130 L148,110 Q130,90 100,105 Q70,90 52,110 Z" fill="#1A1A1A" />
    <!-- Maroon Headband with Qatari flag triangle detail -->
    <path d="M52,90 Q100,80 148,90 L146,98 Q100,88 54,98 Z" fill="#8A1538" />
    <polygon points="90,87 95,93 100,87 105,93 110,87" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <text x="40" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="30" letter-spacing="1">الطفولة المبكرة</text>
  <text x="40" y="95" fill="#C9A227" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16">الصفوف الأولية (١ - ٣) | لعب نشط وحركة</text>

  <!-- Qatari Flag Icon -->
  <g transform="translate(710, 25)">
    <rect width="55" height="32" fill="#8A1538" rx="4" />
    <polygon points="0,0 16,0 11,5 16,10 11,15 16,20 11,25 16,32 0,32" fill="#FFFFFF" />
  </g>
</svg>
